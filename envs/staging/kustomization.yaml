apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: whoami-staging

resources:
  - ../../base

configMapGenerator:
  - name: whoami-config
    behavior: merge
    literals:
      - WHOAMI_NAME=staging

replicas:
  - name: whoami
    count: 2

images:
  - name: traefik/whoami
    newTag: v1.10.0

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: whoami-dev

resources:
  - ../../base

configMapGenerator:
  - name: whoami-config
    behavior: merge
    literals:
      - WHOAMI_NAME=dev

replicas:
  - name: whoami
    count: 1

# La version déployée dans l'environnement : c'est CETTE ligne que l'on promeut.
images:
  - name: traefik/whoami
    newTag: v1.10.1
